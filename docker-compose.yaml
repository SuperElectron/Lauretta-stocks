# Lauretta Stocks: the research desk as a stack.
#
#   tailnet https://lauretta.tailae2b1.ts.net -> tailscale -> gateway :18400 -> api :8000 (/v1, /healthz)
#                                                              gateway :18400 -> anythingllm :3001 (/)
#                                                              gateway :3000  -> vllm :8000 (llm network)
#   api -> broker -> worker
#
# No host ports at all: the tailscale container is the only way in, and it reaches the gateway
# on the `court` network. Local dev (`just up`) uses docker-compose.dev.yaml, the database alone.

name: lauretta-stocks

networks:
  court:
    driver: bridge
  # AnythingLLM and the gateway only: the web app reaches nothing else in the stack.
  web:
    driver: bridge
  # The gateway and vLLM only: api and worker reach the model through the gateway's llm listener.
  llm:
    driver: bridge

volumes:
  pgdata:
  brokerdata:
  models:
  tsstate:
  anythingllm:

# The model key is a file mounted into the gateway and vllm; api and worker hold none.
secrets:
  # vLLM's API key: vllm checks it, the gateway sends it.
  spark_vllm_api_key:
    environment: SPARK_VLLM_API_KEY

x-app: &app
  build:
    context: ./services/agent
  image: lauretta-stocks-agent:latest
  restart: unless-stopped
  networks: [court]
  volumes:
    - models:/cache
  environment:
    LOG_LEVEL: ${LOG_LEVEL}
    USER_ID: ${USER_ID}
    DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    BROKER_URL: redis://:${BROKER_PASSWORD:?set BROKER_PASSWORD}@broker:6379/0
    DB_POOL_MIN: ${DB_POOL_MIN}
    DB_POOL_MAX: ${DB_POOL_MAX}
    # Models go through the gateway, which holds vLLM's key. This internal key only opens
    # the gateway's llm listener; the gateway swaps it for the provider's key.
    AGENT_PROVIDER: openai
    AGENT_BASE_URL: http://gateway:3000/v1
    OPENAI_API_KEY: ${LLM_INTERNAL_KEY:?set LLM_INTERNAL_KEY (random, e.g. openssl rand -hex 32)}
    # vLLM's served model name.
    AGENT_MODEL: gpt-oss-120b
    AGENT_TEMPERATURE: ${AGENT_TEMPERATURE}
    AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS}
    AGENT_TIMEOUT: ${AGENT_TIMEOUT}
    AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT}
    PIPELINE_MAX_REVISIONS: ${PIPELINE_MAX_REVISIONS}
    EMBED_MODEL: ${EMBED_MODEL}
    EMBED_DIMS: ${EMBED_DIMS}
    SEC_USER_AGENT: ${SEC_USER_AGENT}
    # Queue and API tuning; the defaults match src/settings.py.
    BROKER_MIN_IDLE_MS: ${BROKER_MIN_IDLE_MS:-60000}
    BROKER_MAX_DELIVERIES: ${BROKER_MAX_DELIVERIES:-3}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    AGENT_LOCK_WAIT_MS: ${AGENT_LOCK_WAIT_MS:-30000}
    AGENT_LOCK_TTL_MS: ${AGENT_LOCK_TTL_MS:-30000}
    EVENTS_TTL_S: ${EVENTS_TTL_S:-86400}
    API_MAX_WAIT_S: ${API_MAX_WAIT_S:-25}
    API_MAX_STREAM_S: ${API_MAX_STREAM_S:-900}
    AGENT_STREAM_REASONING: ${AGENT_STREAM_REASONING:-true}
  depends_on:
    db:
      condition: service_healthy
    broker:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    networks: [court]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
      start_period: 10s

  broker:
    image: valkey/valkey:9.0.6-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${BROKER_PASSWORD:?set BROKER_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${BROKER_PASSWORD}
    volumes:
      - brokerdata:/data
    mem_limit: 256m
    networks: [court]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  api:
    <<: *app
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "api"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *app
    command: ["python", "-m", "src.worker"]
    # Covers the longest research run, so a deploy lets a job finish instead of killing it mid-run.
    stop_grace_period: 180s
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # The web app at / (and the Android app's pairing server). Its chat model is the desk itself:
  # the Generic OpenAI provider calls the gateway's /v1 with the API key, like any other client.
  # It reaches the gateway only when a chat is sent, so it does not depend on it (no cycle).
  anythingllm:
    image: mintplexlabs/anythingllm:1.16.1
    restart: unless-stopped
    environment:
      STORAGE_DIR: /app/server/storage
      DISABLE_TELEMETRY: "true"
      JWT_SECRET: ${ANYTHINGLLM_JWT_SECRET:?set ANYTHINGLLM_JWT_SECRET (random, e.g. openssl rand -hex 32)}
      # Single-user password from the first boot, so the app is never open. Setting up multi-user
      # mode needs it once; after that the accounts are the login and this is ignored.
      AUTH_TOKEN: ${ANYTHINGLLM_AUTH_TOKEN:?set ANYTHINGLLM_AUTH_TOKEN (the first-run password)}
      LLM_PROVIDER: generic-openai
      GENERIC_OPEN_AI_BASE_PATH: http://gateway:18400/v1
      GENERIC_OPEN_AI_API_KEY: ${GATEWAY_API_KEY:?set GATEWAY_API_KEY}
      GENERIC_OPEN_AI_MODEL_PREF: lauretta
      GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT: "128000"
      GENERIC_OPEN_AI_MAX_TOKENS: "8192"
      # Plain chats take the streaming chat path, not the agent loop that sends tools.
      PROVIDER_DISABLE_NATIVE_TOOL_CALLING: generic-openai
      # Built-in embedder (downloads its small model once into storage) and LanceDB in the volume.
      EMBEDDING_ENGINE: native
      VECTOR_DB: lancedb
    volumes:
      - anythingllm:/app/server/storage
    mem_limit: 3g
    networks: [web]
    healthcheck:
      # The image's own check: GET /api/ping on its port.
      test: ["CMD", "/bin/bash", "/usr/local/bin/docker-healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  gateway:
    image: cr.agentgateway.dev/agentgateway:v1.5.0
    restart: unless-stopped
    command: ["-f", "/etc/agentgateway/config.yaml"]
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?set GATEWAY_API_KEY (clients send it as a Bearer token)}
      LLM_INTERNAL_KEY: ${LLM_INTERNAL_KEY:?set LLM_INTERNAL_KEY (api and worker send it to the llm listener)}
    volumes:
      - ./services/gateway:/etc/agentgateway:ro
      # The image is distroless, so a static busybox is mounted to run the healthcheck.
      - type: image
        source: busybox:1.37.0-musl
        target: /hc
        read_only: true
        image:
          subpath: bin
    secrets:
      - spark_vllm_api_key
    mem_limit: 256m
    networks: [court, web, llm]
    healthcheck:
      # agentgateway's readiness endpoint: ready once the config is loaded and listeners are up.
      test: ["CMD", "/hc/busybox", "wget", "-qO-", "http://127.0.0.1:15021/healthz/ready"]
      interval: 10s
      retries: 12
      start_period: 10s
    depends_on:
      # The gateway resolves its backends once at start, so it restarts when api is recreated.
      api:
        condition: service_healthy
        restart: true
      # Started, not healthy: the API never waits on the web app. Recreating anythingllm still
      # restarts the gateway (it resolves backends at start), which cuts in-flight streams.
      anythingllm:
        condition: service_started
        restart: true
      # Started, not healthy: the model loads for minutes, and the stack comes up meanwhile (model
      # calls fail until vllm is healthy). Recreating vllm restarts the gateway, as above.
      vllm:
        condition: service_started
        restart: true

  # gpt-oss-120b, served OpenAI-compatible on the llm network alone: no host port, so the Spark's
  # firewall never sees it. The flags are the measured budget from dgx-model-serve
  # (box/scripts/start-models.sh): one 121 GB pool shared with the host and other workloads, so
  # change them together, never one alone. The image is pinned by digest for sm_121a / arm64.
  vllm:
    image: ghcr.io/timothystewart6/vllm-gb10@sha256:fa87aea586e02719aba804f76e0895d1f096e8c387573e7981e2681589b3b712
    # Not unless-stopped: a load that keeps failing (say, out of memory) stops after three tries
    # instead of reloading 65 GiB forever next to the Spark's other workloads.
    restart: on-failure:3
    # The key comes from the secret file, not the environment, so `docker inspect` never shows it.
    entrypoint:
      - sh
      - -c
      - >-
        key=$$(cat /run/secrets/spark_vllm_api_key) && [ -n "$$key" ]
        || { echo "vllm: the key is empty; set SPARK_VLLM_API_KEY" >&2; exit 1; };
        VLLM_API_KEY=$$key exec "$$@"
      - vllm
    command:
      - vllm
      - serve
      - openai/gpt-oss-120b
      # The name clients ask for; any other name 404s.
      - --served-model-name=gpt-oss-120b
      - --host=0.0.0.0
      - --port=8000
      # A fraction of the whole pool; KV bytes are exact so start order does not decide the split.
      - --gpu-memory-utilization=0.64
      - --kv-cache-memory-bytes=8053063680
      - --max-num-batched-tokens=16384
      - --kv-cache-dtype=fp8
      - --enable-prefix-caching
      # Without these, every request that carries `tools` is refused with a 400.
      - --tool-call-parser=openai
      - --reasoning-parser=openai_gptoss
      - --enable-auto-tool-choice
      # A bad attention kernel corrupts tokens rather than failing; Triton is the known-good one.
      - --attention-backend=TRITON_ATTN
      # Deterministic defaults; the checkpoint's generation_config is discarded.
      - --generation-config=vllm
      - --override-generation-config={"temperature":0,"top_p":1,"top_k":-1}
    secrets:
      - spark_vllm_api_key
    environment:
      # The weights (~65 GiB) must already be in the cache: a missing model fails at once rather
      # than downloading for longer than the healthcheck allows.
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    # No nvidia runtime is registered with Docker on the Spark; its CDI spec is.
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids: ["nvidia.com/gpu=all"]
              capabilities: [gpu]
    # No mem_limit: host and GPU memory are one pool, and the budget is the flags above.
    networks: [llm]
    healthcheck:
      # /health needs no key. Loading the weights takes about 9 minutes on the Spark.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m

  # pg_dump and a tar of AnythingLLM's storage, at start and nightly into ./backups (git-ignored).
  # A compose service rather than a host cron:
  # it ships with the stack, needs nothing installed on the Spark, and its pg_dump is the same
  # version as the server. Restore: `pg_restore -d <db> backups/<file>.dump`; AnythingLLM: stop it
  # and untar `backups/anythingllm-<time>.tar.gz` into its empty volume.
  backup:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    entrypoint: ["/ops/backup.sh"]
    # An init as PID 1 forwards stop signals and reaps the script's children (pg_dump, tar). The
    # image's own stop signal is postgres's SIGINT, which the script ignores while it sleeps.
    init: true
    stop_signal: SIGTERM
    environment:
      PGHOST: db
      PGUSER: ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./services/backup/backup.sh:/ops/backup.sh:ro
      - ./backups:/backups
      - anythingllm:/anythingllm:ro
    mem_limit: 256m
    networks: [court]
    # Unhealthy when the newest dump or storage tar is older than 26 h (a missed night).
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name \"$${PGDATABASE}-*.dump\" -mmin -1560 | grep -q . && find /backups -name 'anythingllm-*.tar.gz' -mmin -1560 | grep -q ."]
      interval: 10m
      retries: 1
      start_period: 10m
    depends_on:
      db:
        condition: service_healthy

  # The tailnet's only way in: this node (lauretta-host, tag:lauretta) hosts the Tailscale Service
  # svc:lauretta, HTTPS on 443 at https://lauretta.tailae2b1.ts.net, proxied to the gateway
  # (services/tailscale/serve.json). containerboot (v1.96+) advertises the Services in
  # TS_SERVE_CONFIG itself. Funnel is off; the tailnet policy decides who may connect. Userspace
  # networking needs no capabilities or tun device: netstack accepts connections to Service IPs.
  # The Service withdraws when this container stops and returns about 20 s after it starts.
  tailscale:
    image: tailscale/tailscale:v1.102.3
    restart: unless-stopped
    hostname: lauretta-host
    environment:
      # OAuth client secret (scope auth_keys, tag:lauretta only), used as an auth key once; the
      # state volume holds the login afterwards.
      TS_AUTHKEY: ${TS_OAUTH_SECRET:?set TS_OAUTH_SECRET (the tag:lauretta OAuth client secret)}?ephemeral=false&preauthorized=true
      TS_EXTRA_ARGS: --advertise-tags=tag:lauretta
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tsstate:/var/lib/tailscale
      # A directory mount, so containerboot sees changes to serve.json.
      - ./services/tailscale:/config:ro
    mem_limit: 128m
    networks: [court]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on:
      gateway:
        condition: service_healthy
