# Lauretta Stocks: the research desk as a stack.
#
#   tailnet https://lauretta.tailae2b1.ts.net -> tailscale -> gateway :18400 -> api :8000 (/v1, /healthz)
#                                                              gateway :18400 -> anythingllm :3001 (/)
#   worker -> gateway :3000 -> vllm :8000
#   api -> broker -> worker
#
# No host ports at all: the tailscale container is the only way in, and it reaches the gateway
# alone. Each network joins only the containers that must talk, so only the gateway reaches
# api:8000 (the api trusts the user header the gateway sets). Local dev (`just up`) uses
# docker-compose.dev.yaml, the database alone.

name: lauretta-stocks

networks:
  # The tailscale container and the gateway: the way in.
  edge:
    driver: bridge
  # The gateway and api only.
  app:
    driver: bridge
  # api with the database and the broker.
  api-data:
    driver: bridge
  # The worker with the database and the broker, and the gateway's llm listener (`models`).
  worker-data:
    driver: bridge
  models:
    driver: bridge
  # The backup and the database only.
  dump:
    driver: bridge
  # AnythingLLM and the gateway only: the web app reaches nothing else in the stack.
  web:
    driver: bridge
  # The gateway and vLLM only: the worker reaches the model through the gateway's llm listener.
  llm:
    driver: bridge
  # api and the speech service only.
  speech:
    driver: bridge

volumes:
  pgdata:
  brokerdata:
  models:
  tsstate:
  anythingllm:
  speechmodels:

# The model key is a file mounted into the gateway and vllm; api and worker hold none.
secrets:
  # vLLM's API key: vllm checks it, the gateway sends it.
  spark_vllm_api_key:
    environment: SPARK_VLLM_API_KEY

# The agent service (services/agent): the worker, and the one-shot checkpoint migrate.
x-app: &app
  build:
    context: ./services/agent
  image: lauretta-stocks-agent:latest
  restart: unless-stopped
  volumes:
    - models:/cache
  environment: &app-env
    LOG_LEVEL: ${LOG_LEVEL:?set LOG_LEVEL}
    # Who may use the desk; the first is the owner. The gateway maps callers to these ids.
    ALLOWED_USERS: ${ALLOWED_USERS:-mat,max}
    # The app role: row-level security applies to it (services/db/init).
    DATABASE_URL: postgresql://lauretta_app:${DB_APP_PASSWORD:?set DB_APP_PASSWORD (random, e.g. openssl rand -hex 32)}@db:5432/${DB_NAME:?set DB_NAME}
    BROKER_URL: redis://:${BROKER_PASSWORD:?set BROKER_PASSWORD}@broker:6379/0
    DB_POOL_MIN: ${DB_POOL_MIN:?set DB_POOL_MIN}
    DB_POOL_MAX: ${DB_POOL_MAX:?set DB_POOL_MAX}
    # Models go through the gateway, which holds vLLM's key. Only the worker calls a model, so
    # only it gets the gateway's internal key (below).
    AGENT_PROVIDER: openai
    AGENT_BASE_URL: http://gateway:3000/v1
    # vLLM's served model name.
    AGENT_MODEL: gpt-oss-120b
    AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:?set AGENT_TEMPERATURE}
    AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:?set AGENT_MAX_TOKENS}
    AGENT_TIMEOUT: ${AGENT_TIMEOUT:?set AGENT_TIMEOUT}
    AGENT_RECURSION_LIMIT: ${AGENT_RECURSION_LIMIT:?set AGENT_RECURSION_LIMIT}
    PIPELINE_MAX_REVISIONS: ${PIPELINE_MAX_REVISIONS:?set PIPELINE_MAX_REVISIONS}
    EMBED_MODEL: ${EMBED_MODEL:?set EMBED_MODEL}
    EMBED_DIMS: ${EMBED_DIMS:?set EMBED_DIMS}
    SEC_USER_AGENT: ${SEC_USER_AGENT:?set SEC_USER_AGENT}
    # Queue tuning; the defaults match services/agent/src/settings.py.
    BROKER_MIN_IDLE_MS: ${BROKER_MIN_IDLE_MS:-60000}
    BROKER_MAX_DELIVERIES: ${BROKER_MAX_DELIVERIES:-3}
    RESEARCH_FOLLOW_S: ${RESEARCH_FOLLOW_S:-900}
    WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    AGENT_LOCK_WAIT_MS: ${AGENT_LOCK_WAIT_MS:-30000}
    AGENT_LOCK_TTL_MS: ${AGENT_LOCK_TTL_MS:-30000}
    EVENTS_TTL_S: ${EVENTS_TTL_S:-86400}
    AGENT_STREAM_REASONING: ${AGENT_STREAM_REASONING:-true}
  depends_on:
    db:
      condition: service_healthy
    broker:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?set DB_NAME}
      # Read once, by services/db/init/01-app-role.sh, when the volume is first created. Changing
      # them later also needs `ALTER ROLE ... PASSWORD` (AGENTS.md, Users).
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD}
      DB_MIGRATOR_PASSWORD: ${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    networks: [api-data, worker-data, dump]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
      start_period: 10s

  broker:
    image: valkey/valkey:9.1.2-alpine
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${BROKER_PASSWORD:?set BROKER_PASSWORD}", "--appendonly", "yes",
              "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDISCLI_AUTH: ${BROKER_PASSWORD:?set BROKER_PASSWORD}
    volumes:
      - brokerdata:/data
    # maxmemory (200mb, noeviction) sits below this limit, so a full broker refuses writes with
    # an OOM error instead of being killed by the kernel.
    mem_limit: 256m
    networks: [api-data, worker-data]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20

  # The API service (services/api): FastAPI, queues jobs and reads results, never runs a graph.
  # Its own image, with none of the agent's model or data libraries.
  api:
    build:
      context: ./services/api
    image: lauretta-stocks-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    networks: [app, api-data, speech]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:?set LOG_LEVEL}
      ALLOWED_USERS: ${ALLOWED_USERS:-mat,max}
      DATABASE_URL: postgresql://lauretta_app:${DB_APP_PASSWORD:?set DB_APP_PASSWORD (random, e.g. openssl rand -hex 32)}@db:5432/${DB_NAME:?set DB_NAME}
      BROKER_URL: redis://:${BROKER_PASSWORD:?set BROKER_PASSWORD}@broker:6379/0
      DB_POOL_MIN: ${DB_POOL_MIN:?set DB_POOL_MIN}
      DB_POOL_MAX: ${DB_POOL_MAX:?set DB_POOL_MAX}
      EVENTS_TTL_S: ${EVENTS_TTL_S:-86400}
      API_MAX_WAIT_S: ${API_MAX_WAIT_S:-25}
      API_MAX_STREAM_S: ${API_MAX_STREAM_S:-900}
      SPEECH_URL: http://speech:8000
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      TTS_MODEL: ${TTS_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}
      TTS_VOICE: ${TTS_VOICE:-af_heart}
      VOICE_MAX_UPLOAD_BYTES: ${VOICE_MAX_UPLOAD_BYTES:-10000000}
      # api refuses any request without this header, which only the gateway adds (api/edge.py):
      # the database, broker and speech containers share networks with api but cannot forge a user.
      API_GATEWAY_SECRET: ${API_GATEWAY_SECRET:?set API_GATEWAY_SECRET (hex only, e.g. openssl rand -hex 32)}
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    <<: *app
    command: ["python", "-m", "src.worker"]
    networks: [worker-data, models]
    environment:
      <<: *app-env
      # This internal key only opens the gateway's llm listener; the gateway swaps it for vLLM's.
      OPENAI_API_KEY: ${LLM_INTERNAL_KEY:?set LLM_INTERNAL_KEY (random, e.g. openssl rand -hex 32)}
    # Covers the longest research run, so a deploy lets a job finish instead of killing it mid-run.
    stop_grace_period: 180s
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "worker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # One-off deploy step: creates or migrates LangGraph's checkpoint tables as lauretta_migrator,
  # then exits. Only it holds that role's password; the worker just checks the tables at start.
  # Run by `just deploy` and services/db/reset-and-restore.sh: `docker compose run --rm migrate`.
  migrate:
    <<: *app
    profiles: [migrate]
    restart: "no"
    command: ["python", "-m", "src.db.migrate"]
    networks: [worker-data]
    environment:
      <<: *app-env
      DATABASE_SETUP_URL: postgresql://lauretta_migrator:${DB_MIGRATOR_PASSWORD:?set DB_MIGRATOR_PASSWORD (random, e.g. openssl rand -hex 32)}@db:5432/${DB_NAME:?set DB_NAME}
    healthcheck:
      disable: true

  # The web app at / (and the Android app's pairing server). Its chat model is the desk itself:
  # the Generic OpenAI provider calls the gateway's /v1 with the API key, like any other client.
  # It reaches the gateway only when a chat is sent, so it does not depend on it (no cycle).
  anythingllm:
    image: mintplexlabs/anythingllm:1.16.1
    restart: unless-stopped
    environment:
      STORAGE_DIR: /app/server/storage
      DISABLE_TELEMETRY: "true"
      JWT_SECRET: ${ANYTHINGLLM_JWT_SECRET:?set ANYTHINGLLM_JWT_SECRET (random, e.g. openssl rand -hex 32)}
      # Single-user password from the first boot, so the app is never open. Setting up multi-user
      # mode needs it once; after that the accounts are the login and this is ignored.
      AUTH_TOKEN: ${ANYTHINGLLM_AUTH_TOKEN:?set ANYTHINGLLM_AUTH_TOKEN (the first-run password)}
      LLM_PROVIDER: generic-openai
      GENERIC_OPEN_AI_BASE_PATH: http://gateway:18400/v1
      # Its own key, not the owner's: the gateway lets it only list models and chat, and names
      # the user from the model. Each person's workspace sets its chat model to lauretta-<user>
      # (AGENTS.md, Users); this default model names nobody, so a chat outside those workspaces is refused.
      GENERIC_OPEN_AI_API_KEY: ${ANYTHINGLLM_API_KEY:?set ANYTHINGLLM_API_KEY (random, e.g. openssl rand -hex 32)}
      GENERIC_OPEN_AI_MODEL_PREF: lauretta
      GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT: "128000"
      GENERIC_OPEN_AI_MAX_TOKENS: "8192"
      # Read replies aloud with the desk's own speech (Kokoro, through the gateway to api). Its key
      # may call /v1/audio/speech, which acts for nobody; the model name is ignored.
      TTS_PROVIDER: generic-openai
      TTS_OPEN_AI_COMPATIBLE_ENDPOINT: http://gateway:18400/v1
      TTS_OPEN_AI_COMPATIBLE_KEY: ${ANYTHINGLLM_API_KEY:?set ANYTHINGLLM_API_KEY (random, e.g. openssl rand -hex 32)}
      TTS_OPEN_AI_COMPATIBLE_MODEL: kokoro
      TTS_OPEN_AI_COMPATIBLE_VOICE_MODEL: af_heart
      # Plain chats take the streaming chat path, not the agent loop that sends tools.
      PROVIDER_DISABLE_NATIVE_TOOL_CALLING: generic-openai
      # Built-in embedder (downloads its small model once into storage) and LanceDB in the volume.
      EMBEDDING_ENGINE: native
      VECTOR_DB: lancedb
    volumes:
      - anythingllm:/app/server/storage
    mem_limit: 3g
    networks: [web]
    healthcheck:
      # The image's own check: GET /api/ping on its port.
      test: ["CMD", "/bin/bash", "/usr/local/bin/docker-healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s

  gateway:
    image: cr.agentgateway.dev/agentgateway:v1.5.0
    restart: unless-stopped
    command: ["-f", "/etc/agentgateway/config.yaml"]
    environment:
      # The owner's key (scripts; acts as mat) and AnythingLLM's (acts per workspace model).
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?set GATEWAY_API_KEY (the owner's Bearer token)}
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY:?set ANYTHINGLLM_API_KEY}
      LLM_INTERNAL_KEY: ${LLM_INTERNAL_KEY:?set LLM_INTERNAL_KEY (the worker sends it to the llm listener)}
      # Added to every request it sends api, which refuses any other (api/edge.py).
      API_GATEWAY_SECRET: ${API_GATEWAY_SECRET:?set API_GATEWAY_SECRET}
    volumes:
      - ./services/gateway:/etc/agentgateway:ro
      # The image is distroless, so a static busybox is mounted to run the healthcheck.
      - type: image
        source: busybox:1.37.0-musl
        target: /hc
        read_only: true
        image:
          subpath: bin
    secrets:
      - spark_vllm_api_key
    mem_limit: 256m
    networks: [edge, app, models, web, llm]
    healthcheck:
      # agentgateway's readiness endpoint: ready once the config is loaded and listeners are up.
      test: ["CMD", "/hc/busybox", "wget", "-qO-", "http://127.0.0.1:15021/healthz/ready"]
      interval: 10s
      retries: 12
      start_period: 10s
    depends_on:
      # The gateway resolves its backends once at start, so it restarts when api is recreated.
      api:
        condition: service_healthy
        restart: true
      # Started, not healthy: the API never waits on the web app. Recreating anythingllm still
      # restarts the gateway (it resolves backends at start), which cuts in-flight streams.
      anythingllm:
        condition: service_started
        restart: true
      # Started, not healthy: the model loads for minutes, and the stack comes up meanwhile (model
      # calls fail until vllm is healthy). Recreating vllm restarts the gateway, as above.
      vllm:
        condition: service_started
        restart: true

  # Speech for voice: faster-whisper (STT) and Kokoro-82M (TTS) on CPU, no GPU memory (about
  # 2 GB RAM). Only api reaches it (`speech` network). The models download once into
  # `speechmodels` at the first start, before the service counts as healthy.
  speech:
    image: ghcr.io/speaches-ai/speaches@sha256:21e3df06d842fb7802ab470dd77c25f0e8c0d22950e8d8c6ae886e851af53ef8
    restart: unless-stopped
    environment:
      STT_MODEL: ${STT_MODEL:-Systran/faster-whisper-small}
      TTS_MODEL: ${TTS_MODEL:-speaches-ai/Kokoro-82M-v1.0-ONNX}
    command:
      - sh
      - -c
      - >-
        uvicorn --factory speaches.main:create_app & pid=$$!;
        until curl -sf localhost:8000/health >/dev/null; do sleep 2; done;
        for m in $$STT_MODEL $$TTS_MODEL; do
        curl -sf -X POST "localhost:8000/v1/models/$$m" >/dev/null
        || { echo "speech: could not download $$m" >&2; kill $$pid; exit 1; }; done;
        touch /tmp/models-ready; wait $$pid
    volumes:
      - speechmodels:/home/ubuntu/.cache/huggingface
    networks: [speech]
    mem_limit: 4g
    healthcheck:
      # Healthy once both downloads have finished (a model is listed before its files are complete).
      test: ["CMD-SHELL", "test -f /tmp/models-ready && curl -sf localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10m

  # gpt-oss-120b, served OpenAI-compatible on the llm network alone: no host port, so the Spark's
  # firewall never sees it. The flags are the measured budget from dgx-model-serve
  # (box/scripts/start-models.sh): one 121 GB pool shared with the host and other workloads, so
  # change them together, never one alone. The image is pinned by digest for sm_121a / arm64.
  vllm:
    image: ghcr.io/timothystewart6/vllm-gb10@sha256:fa87aea586e02719aba804f76e0895d1f096e8c387573e7981e2681589b3b712
    # Comes back after a reboot. A load that keeps failing (say, out of memory) reloads 65 GiB on
    # every restart next to the Spark's other workloads: stop it with `docker compose stop vllm`.
    restart: unless-stopped
    # The key comes from the secret file, not the environment, so `docker inspect` never shows it.
    entrypoint:
      - sh
      - -c
      - >-
        key=$$(cat /run/secrets/spark_vllm_api_key) && [ -n "$$key" ]
        || { echo "vllm: the key is empty; set SPARK_VLLM_API_KEY" >&2; exit 1; };
        VLLM_API_KEY=$$key exec "$$@"
      - vllm
    command:
      - vllm
      - serve
      - openai/gpt-oss-120b
      # The name clients ask for; any other name 404s.
      - --served-model-name=gpt-oss-120b
      - --host=0.0.0.0
      - --port=8000
      # A fraction of the whole pool; KV bytes are exact so start order does not decide the split.
      - --gpu-memory-utilization=0.64
      - --kv-cache-memory-bytes=8053063680
      - --max-num-batched-tokens=16384
      - --kv-cache-dtype=fp8
      - --enable-prefix-caching
      # Without these, every request that carries `tools` is refused with a 400.
      - --tool-call-parser=openai
      - --reasoning-parser=openai_gptoss
      - --enable-auto-tool-choice
      # A bad attention kernel corrupts tokens rather than failing; Triton is the known-good one.
      - --attention-backend=TRITON_ATTN
      # Deterministic defaults; the checkpoint's generation_config is discarded.
      - --generation-config=vllm
      - --override-generation-config={"temperature":0,"top_p":1,"top_k":-1}
    secrets:
      - spark_vllm_api_key
    environment:
      # The weights (~65 GiB) must already be in the cache: a missing model fails at once rather
      # than downloading for longer than the healthcheck allows.
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    ipc: host
    # No nvidia runtime is registered with Docker on the Spark; its CDI spec is.
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids: ["nvidia.com/gpu=all"]
              capabilities: [gpu]
    # No mem_limit: host and GPU memory are one pool, and the budget is the flags above.
    networks: [llm]
    healthcheck:
      # /health needs no key. Loading the weights takes about 9 minutes on the Spark.
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m

  # pg_dump and a tar of AnythingLLM's storage, at start and nightly into ./backups (git-ignored).
  # A compose service rather than a host cron:
  # it ships with the stack, needs nothing installed on the Spark, and its pg_dump is the same
  # version as the server. Restore: `pg_restore -d <db> backups/<file>.dump`; AnythingLLM: stop it
  # and untar `backups/anythingllm-<time>.tar.gz` into its empty volume.
  backup:
    image: pgvector/pgvector:0.8.6-pg17
    restart: unless-stopped
    entrypoint: ["/ops/backup.sh"]
    # An init as PID 1 forwards stop signals and reaps the script's children (pg_dump, tar). The
    # image's own stop signal is postgres's SIGINT, which the script ignores while it sleeps.
    init: true
    stop_signal: SIGTERM
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:?set DB_USER}
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      PGDATABASE: ${DB_NAME:?set DB_NAME}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./services/backup/backup.sh:/ops/backup.sh:ro
      - ./backups:/backups
      - anythingllm:/anythingllm:ro
    mem_limit: 256m
    networks: [dump]
    # Unhealthy when the newest dump or storage tar is older than 26 h (a missed night).
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name \"$${PGDATABASE}-*.dump\" -mmin -1560 | grep -q . && find /backups -name 'anythingllm-*.tar.gz' -mmin -1560 | grep -q ."]
      interval: 10m
      retries: 1
      start_period: 10m
    depends_on:
      db:
        condition: service_healthy

  # The tailnet's only way in: this node (lauretta-host, tag:lauretta) hosts the Tailscale Service
  # svc:lauretta, HTTPS on 443 at https://lauretta.tailae2b1.ts.net, proxied to the gateway
  # (services/tailscale/serve.json). containerboot applies TS_SERVE_CONFIG but does not always
  # advertise the Service on a fresh container (#45), so the entrypoint does. Funnel is off; the tailnet policy decides who may connect. Userspace
  # networking needs no capabilities or tun device: netstack accepts connections to Service IPs.
  # The Service withdraws when this container stops and returns about 20 s after it starts.
  tailscale:
    image: tailscale/tailscale:v1.102.3
    restart: unless-stopped
    hostname: lauretta-host
    environment:
      # OAuth client secret (scope auth_keys, tag:lauretta only), used as an auth key once; the
      # state volume holds the login afterwards.
      TS_AUTHKEY: ${TS_OAUTH_SECRET:?set TS_OAUTH_SECRET (the tag:lauretta OAuth client secret)}?ephemeral=false&preauthorized=true
      TS_EXTRA_ARGS: --advertise-tags=tag:lauretta
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    # containerboot applies serve.json but, on a fresh container, does not advertise the Service,
    # so the tailnet address times out. Advertise it once the config is in, and forward stop
    # signals to containerboot. Healthy only once advertised.
    entrypoint:
      - sh
      - -c
      - >-
        rm -f /tmp/advertised;
        /usr/local/bin/containerboot & pid=$$!;
        trap 'kill -TERM $$pid; wait $$pid' TERM INT;
        until tailscale serve status --json 2>/dev/null | grep -q '"svc:lauretta"'; do
        kill -0 $$pid || exit 1; sleep 2; done;
        tailscale serve advertise svc:lauretta
        || { echo "tailscale: could not advertise svc:lauretta" >&2; kill -TERM $$pid; exit 1; };
        touch /tmp/advertised;
        wait $$pid
    volumes:
      - tsstate:/var/lib/tailscale
      # A directory mount, so containerboot sees changes to serve.json.
      - ./services/tailscale:/config:ro
    mem_limit: 128m
    networks: [edge]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/advertised && wget -q -O /dev/null http://127.0.0.1:9002/healthz"]
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on:
      gateway:
        condition: service_healthy
