version: 2
updates:
  # Each service's Python dependencies (uv.lock).
  - package-ecosystem: "uv"
    directories: ["/services/agent", "/services/api"]
    target-branch: "staging"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Images referenced by the root compose files (db, broker, gateway, tailscale, etc).
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    ignore:
      # vLLM stays on the digest measured on the Spark (flags, memory budget); bumped by hand only.
      - dependency-name: "timothystewart6/vllm-gb10"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Each service's Dockerfile base image.
  - package-ecosystem: "docker"
    directories: ["/services/agent", "/services/api"]
    target-branch: "staging"
    schedule:
      interval: "weekly"
    ignore:
      # Both services require Python >=3.13,<3.14 (pyproject); a new minor Python is a deliberate change.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Pinned action SHAs in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
