version: 2
updates:
  # services/agent's Python dependencies (uv.lock).
  - package-ecosystem: "uv"
    directory: "/services/agent"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Images referenced by the root compose files (db, broker, gateway, tailscale, etc).
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The agent's own Dockerfile base image.
  - package-ecosystem: "docker"
    directory: "/services/agent"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Pinned action SHAs in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
