# yaml-language-server: $schema=https://raw.githubusercontent.com/agentgateway/agentgateway/v1.5.0/schema/config.json
#
# agentgateway v1.5.0: the one door into the stack, and the only holder of the model key.
#
#   18400  ingress  -> api:8000 (/v1/*, /healthz) and anythingllm:3001 (everything else).
#                      Not published to the host; the tailscale container terminates TLS for
#                      svc:lauretta and proxies here. The gateway is the only container that
#                      shares a network with api, so every API call passes the checks below.
#   3000   llm      -> vllm:8000 on the llm network. Compose networks only, never published;
#                      needs the internal key that only the worker holds.
#
# Route choice is by match, not list order: an exact path beats a prefix, and a longer prefix
# beats a shorter one, so /healthz and /v1/ always reach api and `/` takes only the rest.
# AnythingLLM serves its APIs under /api/ and has no /v1 or /healthz of its own.
#
# Environment variables in dollar-brace form are expanded when the config loads, comments
# included, so an unset one (even in a comment) stops the gateway at start.

gateways:
  ingress:
    port: 18400
    protocol: HTTP
  llm:
    port: 3000
    protocol: HTTP

routes:
  # Liveness for uptime checks. No key, GET only, nothing else on the path.
  - name: ingress-healthz
    gateways: [ingress]
    matches:
      - path:
          exact: /healthz
        method: GET
    policies:
      requestHeaderModifier:
        remove:
          - Authorization
          - Cookie
          - X-Forwarded-User
          - X-User-Id
          - X-Principal
          - Tailscale-User-Login
          - Tailscale-User-Name
          - Tailscale-User-Profile-Pic
          - Tailscale-Headers-Info
          - Tailscale-App-Capabilities
          - X-Lauretta-User
          - X-Lauretta-Caller
          - X-Forwarded-For
          - X-Real-IP
          - Forwarded
          - X-Forwarded-Host
          - X-Forwarded-Proto
      localRateLimit:
        - maxTokens: 60
          tokensPerFill: 60
          fillInterval: 60s
          type: requests
      timeout:
        requestTimeout: 5s
    backends:
      - host: api:8000

  # The API, and who each request acts for. Two keys, each with its caller in the metadata:
  #   GATEWAY_API_KEY      the owner's own key (scripts, curl): always the user `mat`.
  #   ANYTHINGLLM_API_KEY  AnythingLLM's key. It sends no user, so the user comes from the model
  #                        its workspace chats with: lauretta-mat -> mat, lauretta-max -> max.
  #                        It may only list models and chat.
  # The gateway sets X-Lauretta-User and X-Lauretta-Caller itself. A client's copy never reaches
  # api: `set` replaces it, and when the expression cannot name a user (another model, no body,
  # a body too big to buffer) the header is removed and left out, so api answers 401. Tested on
  # v1.5.0. They are not in requestHeaderModifier.remove below: that runs after `set` and would
  # strip the gateway's own value.
  # To add a user (five places, README "Users and isolation"): the user map and the model list
  # in the authorization rule below, a rate-limit bucket, ALLOWED_USERS, and a workspace.
  # Authorization, cookies and the other identity and forwarding headers are then removed.
  # tailscale serve's Tailscale-User-* headers are not trusted: AnythingLLM's calls carry none.
  # apiKey in v1.5.0 takes the key inline (or its sha256 hash), not from a file, so compose
  # passes the keys into the gateway's environment only.
  # Reading `request.body` buffers the request body (not the response): streams still flow.
  - name: ingress-api
    gateways: [ingress]
    matches:
      - path:
          pathPrefix: /v1/
    policies:
      apiKey:
        mode: strict
        location:
          header:
            name: Authorization
            prefix: "Bearer "
        keys:
          - key: ${GATEWAY_API_KEY}
            metadata: {caller: owner, user: mat}
          - key: ${ANYTHINGLLM_API_KEY}
            metadata: {caller: anythingllm}
      # AnythingLLM may list models, and chat only as a user the map below names: any other
      # model, or a body that cannot be read, is refused here (403) rather than sent on.
      authorization:
        rules:
          - require: >-
              apiKey.caller != "anythingllm" || request.path == "/v1/models"
              || (request.path == "/v1/chat/completions"
                  && json(request.body).model in ["lauretta-mat", "lauretta-max"])
      requestHeaderModifier:
        remove:
          - Authorization
          - Cookie
          - X-Forwarded-User
          - X-User-Id
          - X-Principal
          - Tailscale-User-Login
          - Tailscale-User-Name
          - Tailscale-User-Profile-Pic
          - Tailscale-Headers-Info
          - Tailscale-App-Capabilities
          - X-Forwarded-For
          - X-Real-IP
          - Forwarded
          - X-Forwarded-Host
          - X-Forwarded-Proto
      transformations:
        request:
          set:
            X-Lauretta-Caller: 'apiKey.caller'
            X-Lauretta-User: >-
              apiKey.caller == "anythingllm"
              ? {"lauretta-mat": "mat", "lauretta-max": "max"}[json(request.body).model]
              : apiKey.user
      # A bucket per user: Max's chats from AnythingLLM never use up the owner's.
      localRateLimit:
        conditional:
          - condition: >-
              apiKey.caller == "anythingllm" && request.method == "POST"
              && json(request.body).model == "lauretta-max"
            maxTokens: 120
            tokensPerFill: 120
            fillInterval: 60s
            type: requests
          - maxTokens: 120
            tokensPerFill: 120
            fillInterval: 60s
            type: requests
      # requestTimeout bounds only the time to the response headers in v1.5.0, not the body,
      # so a long research stream is not cut; api bounds the stream itself.
      timeout:
        requestTimeout: 30s
    backends:
      - host: api:8000

  # AnythingLLM: the web app, its /api/ and the agent WebSocket (/api/agent-invocation/*).
  # No apiKey: AnythingLLM has its own login (a password from the first boot, then accounts).
  # Authorization and Cookie pass through, since they carry that login; claimed identity and
  # forwarding headers are stripped as for the API.
  # No `buffer` policy: chats stream as server-sent events and WebSocket upgrades pass as is.
  # The body cap is a CEL check of Content-Length (100 MiB), which never holds the body in the
  # gateway. The gateway strips Transfer-Encoding before policies run, so a chunked body cannot be
  # seen; POST, PUT and PATCH must therefore carry a Content-Length (browsers always send one).
  - name: ingress-anythingllm
    gateways: [ingress]
    matches:
      - path:
          pathPrefix: /
    policies:
      requestHeaderModifier:
        remove:
          - X-Forwarded-User
          - X-User-Id
          - X-Principal
          - Tailscale-User-Login
          - Tailscale-User-Name
          - Tailscale-User-Profile-Pic
          - Tailscale-Headers-Info
          - X-Lauretta-User
          - X-Lauretta-Caller
          - X-Forwarded-For
          - X-Real-IP
          - Forwarded
          - X-Forwarded-Host
          - X-Forwarded-Proto
      authorization:
        rules:
          - require: >-
              "content-length" in request.headers
              ? int(request.headers["content-length"]) <= 104857600
              : !(request.method in ["POST", "PUT", "PATCH"])
      # A page load fetches many scripts, so the bucket is larger than the API's.
      localRateLimit:
        - maxTokens: 600
          tokensPerFill: 600
          fillInterval: 60s
          type: requests
      # requestTimeout bounds only the time to the response headers in v1.5.0, not the body or an
      # upgraded WebSocket, so long chats stream on. It must cover an upload being parsed.
      timeout:
        requestTimeout: 600s
    backends:
      - host: anythingllm:3001

# Model egress. The worker calls http://gateway:3000/v1 with the internal key, which apiKey
# checks and removes; the gateway then attaches vLLM's own key. The listener is reachable
# from every network the gateway joins (including AnythingLLM's `web`), so it is never open.
# The only model is gpt-oss-120b, served by the vllm service on the Spark.
llm:
  gateways: [llm]
  policies:
    apiKey:
      mode: strict
      location:
        header:
          name: Authorization
          prefix: "Bearer "
      keys:
        - key: ${LLM_INTERNAL_KEY}
    # Stops a runaway loop from monopolising the one engine; a research run makes many calls, so
    # it is set well above normal use.
    localRateLimit:
      - maxTokens: 600
        tokensPerFill: 600
        fillInterval: 60s
        type: requests
  providers:
    # vLLM speaks the OpenAI API. `vllm` is the compose service, reached on the llm network.
    - name: vllm
      provider: openai
      params:
        baseUrl: http://vllm:8000/v1
        apiKey:
          file: /run/secrets/spark_vllm_api_key
  models:
    # Must match vLLM's served model name.
    - name: gpt-oss-120b
      provider:
        reference: vllm
