[project]
name = "stockstory-agent"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres",
    "langchain-core",
    "langchain-anthropic",
    # reasoning.py overrides a private ChatOpenAI hook; bump minors deliberately (#19)
    "langchain-openai>=1.6.2,<1.7",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary,pool]",
    "httpx",
    "yfinance",
    "fastembed",
    "loguru",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "redis>=8.1.0",
    "httpx2>=2.13.0",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.38.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
