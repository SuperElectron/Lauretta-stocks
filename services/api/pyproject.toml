[project]
name = "lauretta-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "psycopg[binary,pool]",
    "httpx",
    "loguru",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "redis>=8.1.0",
    "mcp>=1,<2",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "fakeredis[lua]>=2.38.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a real database (just test-db); skipped otherwise"]
pythonpath = ["."]
